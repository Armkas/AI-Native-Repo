name: Release

on:
  push:
    # Trigger only when pushing tags starting with 'v' (e.g., v1.0.1, v2.0.0)
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow GitHub Actions to create a Release
      packages: write # Allow GitHub Actions to publish to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically generate release notes based on commit history
          generate_release_notes: true

      - name: Publish to GitHub Packages
        run: |
          cd cli
          # Change package name to scoped lowercase name for GitHub Packages
          sed -i 's/"name": "ai-native-repo"/"name": "@armkas\/ai-native-repo"/' package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
